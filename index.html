<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BPP Roll Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- App-like behavior when added to home screen (iOS + Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BPP Roll Tracker">
<meta name="theme-color" content="#1a5fb4">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a5fb4'/%3E%3Ctext x='50' y='62' font-size='42' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'%3EBR%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a5fb4'/%3E%3Ctext x='50' y='62' font-size='42' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'%3EBR%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22BPP%20Roll%20Tracker%22%2C%22short_name%22%3A%22BPP%20Roll%20Tracker%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22theme_color%22%3A%22%231a5fb4%22%2C%22background_color%22%3A%22%23eef0f3%22%7D">
<style>
  :root{ --ink:#111318; --accent:#1a5fb4; --ok:#1c7a3c; --err:#b3261e; --muted:#6b7280; --line:#d3d7de; }
  *{box-sizing:border-box;}
  body{ margin:0 auto; max-width:900px; font-family:'Segoe UI', Arial, sans-serif; background:#eef0f3; color:var(--ink); padding:10px; }

  @media (min-width:700px){
    body{ padding:24px 32px; }
    .toolbar button{ min-width:160px; }
    .opform-box{ max-width:420px; }
    #printOpBtn{ max-width:420px; }
    table{ min-width:0; width:100%; }
    .tbl-wrap{ overflow-x:visible; }
  }
  h1{ font-size:1.15rem; margin:0 0 2px; }
  .sub{ color:var(--muted); font-size:0.8rem; margin-bottom:10px; }

  .toolbar{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .toolbar button{ flex:1; min-width:130px; padding:12px; font-weight:700; border:none; border-radius:10px; font-size:0.85rem; cursor:pointer; }
  #syncBtn{ background:#1a5fb4; color:#fff; }
  #exportBtn{ background:var(--ok); color:#fff; }
  #resetBtn{ background:#b3261e; color:#fff; }

  .tabs{ display:flex; gap:6px; margin-bottom:0; flex-wrap:wrap; }
  .tab-btn{ flex:1; min-width:90px; padding:12px; font-weight:700; border:none; border-radius:10px 10px 0 0; background:#d9dee5; color:#555; font-size:0.9rem; cursor:pointer; }
  .tab-btn.active{ background:var(--accent); color:#fff; }

  .panel{ display:none; background:#fff; border-radius:0 10px 10px 10px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .panel.active{ display:block; }

  .empty-msg{ padding:20px; text-align:center; color:var(--muted); font-size:0.9rem; }

  .tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ border-collapse:collapse; width:100%; min-width:560px; }
  th, td{ border:1px solid var(--line); padding:6px; font-size:0.85rem; text-align:left; }
  th{ background:#f2f4f7; }
  td input, td select{ width:100%; border:none; padding:6px 4px; font-size:0.9rem; background:transparent; }
  td input:focus, td select:focus{ outline:2px solid var(--accent); background:#fff; }
  td input[readonly]{ font-weight:700; color:#333; }

  .settings-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .settings-grid label{ font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px; }
  .settings-grid input, .settings-grid textarea{
    width:100%; padding:10px; border-radius:8px; border:1.5px solid var(--line); font-size:0.95rem;
  }

  #status{ text-align:center; font-size:0.85rem; min-height:1.2em; margin-top:6px; }
  #status.ok{ color:var(--ok); } #status.err{ color:var(--err); }

  /* ---- Printable slip ---- */
  #slip{ display:none; }
  @media print{
    @page{ size: 25cm 17cm; margin: 0; }
    html, body{ margin:0; padding:0; height:17cm; }
    body > h1, body > .toolbar, body > .tabs, body > .panel, body > #status, body > #authStatus{ display:none !important; }
    #slip{ display:flex; position:absolute; top:50%; left:0; transform:translateY(-50%); }
  }
  .slip-outer{ display:flex; align-items:stretch; font-family:Arial, sans-serif; color:#000; width:11.5cm; }
  .slip-box{ width:8cm; border:2px solid #111; border-right:none; }
  .slip-row{ border-bottom:1px solid #111; padding:4px 6px; }
  .slip-title{ font-size:1.3rem; font-weight:800; }
  .slip-head-row{ text-align:center; font-weight:700; }
  .slip-grid{ display:flex; }
  .slip-grid > div{ flex:1; padding:4px 6px; border-right:1px solid #111; border-bottom:1px solid #111; }
  .slip-grid > div:last-child{ border-right:none; }
  .slip-label{ font-size:0.68rem; color:#333; }
  .slip-value{ font-size:0.95rem; font-weight:700; }
  .slip-mrp{ display:flex; align-items:center; }
  .slip-mrp .slip-label{ flex:0 0 110px; }
  .slip-mrp .slip-value{ flex:1; text-align:center; font-size:1rem; }
  .slip-plain-row{ padding:4px 6px; border-bottom:1px solid #111; font-size:0.8rem; }
  .slip-email-box{ margin:6px; border:2px solid #1a5fb4; padding:8px; font-size:0.8rem; min-height:30px; }
  .barcode-col{ border:2px solid #111; display:flex; align-items:center; justify-content:center; overflow:visible; width:3.5cm; }

  /* ---- On-screen operator form ---- */
  .opform-outer{ display:flex; justify-content:center; margin-bottom:14px; }
  .opform-box{ width:100%; max-width:380px; border:2px solid #111; font-family:Arial, sans-serif; color:#000; background:#fff; border-radius:8px; overflow:hidden; }
  .opform-row{ border-bottom:1px solid #111; padding:8px 10px; }
  .opform-head-row{ text-align:center; font-weight:700; background:#f2f4f7; }
  .opform-grid{ display:flex; }
  .opform-grid > div{ flex:1; padding:6px 10px; border-right:1px solid #111; border-bottom:1px solid #111; }
  .opform-grid > div:last-child{ border-right:none; }
  .opform-label{ font-size:0.75rem; color:#333; display:block; margin-bottom:2px; }
  .opform-grid select, .opform-grid input{
    width:100%; border:none; border-bottom:2px solid var(--accent); background:transparent;
    font-size:1.05rem; font-weight:700; padding:4px 0; color:#000;
  }
  .opform-grid select:focus, .opform-grid input:focus{ outline:none; }
  .opform-net{ font-size:1.05rem; font-weight:700; }
  .opform-mrp{ display:flex; align-items:center; gap:10px; }
  .opform-mrp .opform-label{ margin:0; flex:0 0 130px; }
  .opform-extra{ padding:6px 10px; border-bottom:1px solid #111; }
  .opform-extra input{ width:100%; border:1px solid var(--line); border-radius:6px; padding:6px; font-size:0.9rem; }
  #printOpBtn{ width:100%; max-width:380px; display:block; margin:10px auto 0; padding:16px; font-size:1.1rem; font-weight:700; border:none; border-radius:10px; background:var(--ink); color:#fff; cursor:pointer; }
</style>
</head>
<body>

<h1>BPP Roll Tracker</h1>
<div id="authStatus" style="font-size:0.78rem; color:var(--muted); margin-bottom:8px;">Not signed in</div>

<div class="toolbar">
  <button id="syncBtn">Sync Now</button>
  <button id="exportBtn">Export Inventory</button>
  <button id="resetBtn">Reset</button>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="prod">Operator</button>
  <button class="tab-btn" data-tab="sales">Sales</button>
  <button class="tab-btn" data-tab="settings">Business Details</button>
</div>

<div class="panel active" id="panel-prod">
  <div id="prodContent"></div>
</div>

<div class="panel" id="panel-sales">
  <div id="salesContent"></div>
</div>

<div class="panel" id="panel-settings">
  <div class="settings-grid" id="settingsGrid"></div>
</div>

<div id="status"></div>

<!-- Hidden printable slip -->
<div id="slip">
  <div class="slip-outer">
    <div class="slip-box">
      <div class="slip-row slip-title" id="p_company">Bpp Poly Pack</div>
      <div class="slip-row" id="p_addr1">Plot No. , 1st Cross Road</div>
      <div class="slip-row" id="p_addr2">KIADB Industrial Area</div>
      <div class="slip-row" id="p_addr3">Mmmm, abc-577777</div>
      <div class="slip-row slip-head-row">PACKING SLIP</div>

      <div class="slip-grid">
        <div><span class="slip-label">Product</span><br><span class="slip-value" id="s_product"></span></div>
        <div><span class="slip-label">Gross Wt.</span><br><span class="slip-value" id="s_gross"></span></div>
      </div>
      <div class="slip-grid">
        <div><span class="slip-label">Size</span><br><span class="slip-value" id="s_size"></span></div>
        <div><span class="slip-label">Core Wt.</span><br><span class="slip-value" id="s_core"></span></div>
      </div>
      <div class="slip-grid">
        <div><span class="slip-label">Roll No.</span><br><span class="slip-value" id="s_roll"></span></div>
        <div><span class="slip-label">Net Wt.</span><br><span class="slip-value" id="s_net"></span></div>
      </div>

      <div class="slip-mrp slip-row">
        <span class="slip-label">MRP<br>(Inclusive of Taxes)</span>
        <span class="slip-value" id="p_mrp"></span>
      </div>

      <div class="slip-plain-row" id="p_clm">CLM/PCR/CR</div>
      <div class="slip-plain-row" id="p_mob">Mob.:</div>
      <div class="slip-plain-row" id="p_gstin">GSTIN:</div>

      <div class="slip-email-box" id="p_email"></div>
    </div>
    <div class="barcode-col"><svg id="barcode"></svg></div>
  </div>
</div>

<!-- Included JsBarcode & SheetJS runtime scripts remain bundled identically -->
<script>
/* ============ Bundled master-sheet defaults ============ */
const DEFAULT_STATE = {
  prod: {
    columns: [
      { key:'Roll No.', type:'auto' },
      { key:'Product',  type:'select', options:['SNK02','SNK03','SNK04'] },
      { key:'Size',     type:'select', options:['600/85','500/85','450/75'] },
      { key:'Gross Wt', type:'number' },
      { key:'Core Wt',  type:'number' },
      { key:'Net Wt',   type:'number' },
      { key:'Timestamp',type:'text' }
    ],
    rows: []
  },
  sales: []
};

const DEFAULT_BUSINESS = {
  company:'Bpp Poly Pack',
  addr1:'Plot No. , 1st Cross Road',
  addr2:'KIADB Industrial Area',
  addr3:'Mmmm, abc-577777',
  mrp:'5300/-',
  clm:'CLM/PCR/CR',
  mob:'Mob.:',
  gstin:'GSTIN:',
  email:'abc@gmail.com',
  deviceTag:'P1',
  spreadsheetId:''
};

let state = loadState();
let business = loadBusiness();

function loadState(){
  const raw = localStorage.getItem('bpp_state_v3');
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.sales)) parsed.sales = [];
      return parsed;
    }catch(e){}
  }
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function persist(){ localStorage.setItem('bpp_state_v3', JSON.stringify(state)); }

function loadBusiness(){
  const raw = localStorage.getItem('bpp_business_v1');
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return JSON.parse(JSON.stringify(DEFAULT_BUSINESS));
}
function persistBusiness(){ localStorage.setItem('bpp_business_v1', JSON.stringify(business)); }

const BUSINESS_FIELDS = [
  { key:'company', label:'Company Name' },
  { key:'addr1',   label:'Address Line 1' },
  { key:'addr2',   label:'Address Line 2' },
  { key:'addr3',   label:'Address Line 3 (City, PIN)' },
  { key:'mrp',     label:'MRP (Inclusive of Taxes)' },
  { key:'clm',     label:'CLM/PCR/CR' },
  { key:'mob',     label:'Mobile' },
  { key:'gstin',   label:'GSTIN' },
  { key:'email',   label:'Email' },
  { key:'deviceTag', label:'Device Tag (e.g. P1)' },
  { key:'spreadsheetId', label:'Google Sheet ID' }
];

function renderSettings(){
  const grid = document.getElementById('settingsGrid');
  grid.innerHTML = '';
  BUSINESS_FIELDS.forEach(f=>{
    const wrap = document.createElement('div');
    const label = document.createElement('label'); label.textContent = f.label;
    const input = document.createElement('input'); input.type='text'; input.value = business[f.key] || '';
    input.addEventListener('change', ()=>{ business[f.key] = input.value; persistBusiness(); });
    wrap.appendChild(label); wrap.appendChild(input);
    grid.appendChild(wrap);
  });
}

function findCol(cols, ...hints){
  return cols.find(c => hints.some(h => c.key.toLowerCase().includes(h)));
}
function formatTimestamp(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let opDraft = JSON.parse(localStorage.getItem('bpp_opdraft') || '{}');
function saveDraft(){ localStorage.setItem('bpp_opdraft', JSON.stringify(opDraft)); }

function loadCounters(){
  const raw = localStorage.getItem('bpp_rollcounters_v1');
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {};
}
function persistCounters(c){ localStorage.setItem('bpp_rollcounters_v1', JSON.stringify(c)); }
function comboKey(product,size){ return (product||'')+'||'+(size||''); }

function formatRollNo(product,size,n){
  const tag = (business.deviceTag||'').trim();
  return tag ? `${product}-${size}-${tag}-${String(n).padStart(3,'0')}` : `${product}-${size}-${String(n).padStart(3,'0')}`;
}
function previewRollNo(product,size){
  if(!product||!size) return '—';
  const counters = loadCounters();
  const next = (counters[comboKey(product,size)]||0)+1;
  return formatRollNo(product,size,next);
}
function nextRollNo(product,size){
  const counters = loadCounters();
  const key = comboKey(product,size);
  const next = (counters[key]||0)+1;
  counters[key] = next;
  persistCounters(counters);
  return formatRollNo(product,size,next);
}
function coreWtForSize(size){
  if(!size) return '';
  const lead = parseFloat(String(size).split('/')[0]);
  if(isNaN(lead)) return '';
  return (lead/1000).toFixed(2);
}

function renderOperatorForm(){
  const contentEl = document.getElementById('prodContent');
  contentEl.innerHTML = '';
  const cols = state.prod.columns;
  if(!cols.length){
    contentEl.innerHTML = '<div class="empty-msg">No columns configured.</div>';
    return;
  }
  const rollCol=findCol(cols,'roll'), prodCol=findCol(cols,'product'), sizeCol=findCol(cols,'size'),
        grossCol=findCol(cols,'gross'), coreCol=findCol(cols,'core'), netCol=findCol(cols,'net'), tsCol=findCol(cols,'timestamp');
  const mapped = new Set([rollCol,prodCol,sizeCol,grossCol,coreCol,netCol,tsCol].filter(Boolean).map(c=>c.key));
  const extraCols = cols.filter(c=>!mapped.has(c.key));

  const product = prodCol ? (opDraft[prodCol.key]||'') : '';
  const size = sizeCol ? (opDraft[sizeCol.key]||'') : '';
  const core = coreWtForSize(size) || '0.60';
  if(coreCol) opDraft[coreCol.key] = core;

  function rowEl(cls, text){ const d=document.createElement('div'); d.className='opform-row'+(cls?' '+cls:''); d.textContent=text||''; return d; }
  function plainRow(text){ const d=document.createElement('div'); d.className='opform-plain'; d.textContent=text||''; return d; }
  function gridRow(a,b){ const r=document.createElement('div'); r.className='opform-grid'; r.appendChild(a); r.appendChild(b); return r; }
  function computeNetDisplay(){
    if(!grossCol) return '';
    const g = parseFloat(opDraft[grossCol.key])||0;
    const c = parseFloat(core)||0;
    return g ? (g-c).toFixed(2)+' kg' : '';
  }

  const outer = document.createElement('div'); outer.className='opform-outer';
  const box = document.createElement('div'); box.className='opform-box';

  box.appendChild(rowEl('opform-title', business.company));
  box.appendChild(rowEl('', business.addr1));
  box.appendChild(rowEl('', business.addr2));
  box.appendChild(rowEl('', business.addr3));
  box.appendChild(rowEl('opform-head-row', 'PACKING SLIP'));

  const prodCell = document.createElement('div');
  const prodLabel = document.createElement('span'); prodLabel.className='opform-label'; prodLabel.textContent='Product';
  prodCell.appendChild(prodLabel);
  if(prodCol){
    const sel = document.createElement('select');
    sel.appendChild(new Option('Select…',''));
    (prodCol.options||[]).forEach(o=>sel.appendChild(new Option(o,o)));
    sel.value = product;
    sel.addEventListener('change', ()=>{
      opDraft[prodCol.key] = sel.value;
      if(grossCol) opDraft[grossCol.key] = '';
      saveDraft(); renderOperatorForm();
    });
    prodCell.appendChild(sel);
  }

  const grossCell = document.createElement('div');
  const grossLabel = document.createElement('span'); grossLabel.className='opform-label'; grossLabel.textContent='Gross Wt. (kg)';
  grossCell.appendChild(grossLabel);
  const grossInput = document.createElement('input');
  grossInput.type='number'; grossInput.step='0.01';
  grossInput.value = grossCol ? (opDraft[grossCol.key]||'') : '';
  grossInput.addEventListener('input', ()=>{
    if(grossCol){ opDraft[grossCol.key]=grossInput.value; saveDraft(); }
    const netEl=document.getElementById('opform_net_display');
    if(netEl) netEl.textContent = computeNetDisplay();
  });
  grossCell.appendChild(grossInput);

  box.appendChild(gridRow(prodCell, grossCell));

  const sizeCell = document.createElement('div');
  const sizeLabel = document.createElement('span'); sizeLabel.className='opform-label'; sizeLabel.textContent='Size';
  sizeCell.appendChild(sizeLabel);
  if(sizeCol){
    const sel = document.createElement('select');
    sel.appendChild(new Option('Select…',''));
    (sizeCol.options||[]).forEach(o=>sel.appendChild(new Option(o,o)));
    sel.value = size;
    sel.addEventListener('change', ()=>{
      opDraft[sizeCol.key] = sel.value;
      if(grossCol) opDraft[grossCol.key] = '';
      saveDraft(); renderOperatorForm();
    });
    sizeCell.appendChild(sel);
  }

  const coreCell = document.createElement('div');
  const coreLabel = document.createElement('span'); coreLabel.className='opform-label'; coreLabel.textContent='Core Wt. (kg)';
  const coreVal = document.createElement('div'); coreVal.className='opform-net'; coreVal.textContent = core ? core+' kg' : '—';
  coreCell.appendChild(coreLabel); coreCell.appendChild(coreVal);

  box.appendChild(gridRow(sizeCell, coreCell));

  const rollCell = document.createElement('div');
  const rollLabel = document.createElement('span'); rollLabel.className='opform-label'; rollLabel.textContent='Roll No. (auto)';
  const rollVal = document.createElement('div'); rollVal.className='opform-net'; rollVal.id='opform_roll_preview';
  rollVal.textContent = previewRollNo(product, size);
  rollCell.appendChild(rollLabel); rollCell.appendChild(rollVal);

  const netCell = document.createElement('div');
  const netLabel = document.createElement('span'); netLabel.className='opform-label'; netLabel.textContent='Net Wt.';
  const netVal = document.createElement('div'); netVal.className='opform-net'; netVal.id='opform_net_display'; netVal.textContent = computeNetDisplay();
  netCell.appendChild(netLabel); netCell.appendChild(netVal);

  box.appendChild(gridRow(rollCell, netCell));

  const mrpRow = document.createElement('div'); mrpRow.className='opform-row opform-mrp';
  const mrpLabel=document.createElement('span'); mrpLabel.className='opform-label'; mrpLabel.textContent='MRP (Inclusive of Taxes)';
  const mrpVal=document.createElement('span'); mrpVal.textContent = business.mrp;
  mrpRow.appendChild(mrpLabel); mrpRow.appendChild(mrpVal);
  box.appendChild(mrpRow);

  box.appendChild(plainRow(business.clm));
  box.appendChild(plainRow(business.mob));
  box.appendChild(plainRow(business.gstin));

  extraCols.forEach(c=>{
    const row=document.createElement('div'); row.className='opform-extra';
    const label=document.createElement('label'); label.className='opform-label'; label.textContent=c.key;
    let input;
    if(c.type==='select'){ input=document.createElement('select'); input.appendChild(new Option('Select…','')); (c.options||[]).forEach(o=>input.appendChild(new Option(o,o))); }
    else { input=document.createElement('input'); input.type = c.type==='date'?'date':(c.type==='number'?'number':'text'); }
    input.value = opDraft[c.key] || '';
    input.addEventListener('change', ()=>{ opDraft[c.key]=input.value; saveDraft(); });
    row.appendChild(label); row.appendChild(input);
    box.appendChild(row);
  });

  outer.appendChild(box);
  contentEl.appendChild(outer);

  const printBtn = document.createElement('button');
  printBtn.id='printOpBtn'; printBtn.textContent='Print Label';
  printBtn.addEventListener('click', onPrintOperator);
  contentEl.appendChild(printBtn);

  renderReprintPanel(contentEl);
}

function fillAndPrintSlip(product,size,rollNo,gross,core,net){
  document.getElementById('p_company').textContent = business.company;
  document.getElementById('p_addr1').textContent = business.addr1;
  document.getElementById('p_addr2').textContent = business.addr2;
  document.getElementById('p_addr3').textContent = business.addr3;
  document.getElementById('p_mrp').textContent = business.mrp;
  document.getElementById('p_clm').textContent = business.clm;
  document.getElementById('p_mob').textContent = business.mob;
  document.getElementById('p_gstin').textContent = business.gstin;
  document.getElementById('p_email').textContent = business.email;

  document.getElementById('s_product').textContent = product||'';
  document.getElementById('s_size').textContent = size||'';
  document.getElementById('s_roll').textContent = rollNo||'';
  document.getElementById('s_gross').textContent = (gross||'')+' kg';
  document.getElementById('s_core').textContent = (core||'')+' kg';
  document.getElementById('s_net').textContent = (net||'')+' kg';

  JsBarcode('#barcode', `*${rollNo}-${net||''}*`, { format:'CODE128', width:1.3, height:280, displayValue:false, margin:0 });
  makeBarcodeVertical(document.getElementById('barcode'));
  window.print();
}

function makeBarcodeVertical(svgEl){
  const w = parseFloat(svgEl.getAttribute('width'))||100;
  const h = parseFloat(svgEl.getAttribute('height'))||280;
  let g = svgEl.querySelector('g.rotate-wrap');
  if(!g){
    g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','rotate-wrap');
    while(svgEl.firstChild){ g.appendChild(svgEl.firstChild); }
    svgEl.appendChild(g);
  }
  g.setAttribute('transform', `translate(${h/2}, ${w/2}) rotate(90) translate(${-w/2}, ${-h/2})`);
  svgEl.setAttribute('viewBox', `0 0 ${h} ${w}`);
  svgEl.removeAttribute('width'); svgEl.removeAttribute('height');

  const MAX_W_CM = 3.5, MAX_H_CM = 15;
  let finalWCm = MAX_W_CM;
  let finalHCm = finalWCm * (w / h);
  if(finalHCm > MAX_H_CM){
    finalHCm = MAX_H_CM;
    finalWCm = finalHCm * (h / w);
  }
  svgEl.style.width = finalWCm+'cm';
  svgEl.style.height = finalHCm+'cm';

  const bcCol = svgEl.closest('.barcode-col');
  if(bcCol){ bcCol.style.width = finalWCm+'cm'; bcCol.style.height = finalHCm+'cm'; }
}

async function onPrintOperator(){
  const cols = state.prod.columns;
  const rollCol=findCol(cols,'roll'), prodCol=findCol(cols,'product'), sizeCol=findCol(cols,'size'),
        grossCol=findCol(cols,'gross'), coreCol=findCol(cols,'core'), netCol=findCol(cols,'net'), tsCol=findCol(cols,'timestamp');

  const product = prodCol?opDraft[prodCol.key]:'';
  const size = sizeCol?opDraft[sizeCol.key]:'';
  const gross = grossCol?opDraft[grossCol.key]:'';
  const core = coreWtForSize(size) || '0.60';

  if(!size || !product){ setStatus('Select Product and Size first.', 'err'); return; }
  if(!gross){ setStatus('Enter Gross Wt. first.', 'err'); return; }

  const printBtn = document.getElementById('printOpBtn');
  if(printBtn){ printBtn.disabled = true; printBtn.textContent = 'Syncing…'; }
  await syncNow(true);
  if(printBtn){ printBtn.disabled = false; printBtn.textContent = 'Print Label'; }

  const rollNo = nextRollNo(product,size);
  const net = (parseFloat(gross)-parseFloat(core)).toFixed(2);

  const row = {};
  cols.forEach(c=>{ row[c.key] = opDraft[c.key] || ''; });
  if(rollCol) row[rollCol.key]=rollNo;
  if(coreCol) row[coreCol.key]=core;
  if(netCol) row[netCol.key]=net;
  if(tsCol) row[tsCol.key]=formatTimestamp();
  row._synced = false;
  state.prod.rows.push(row); persist();

  fillAndPrintSlip(product,size,rollNo,gross,core,net);

  if(grossCol) opDraft[grossCol.key] = '';
  saveDraft();
  renderAll();
  syncNow(true);
}

let selectedRolls = new Set(JSON.parse(localStorage.getItem('bpp_selected_rolls') || '[]'));
function persistSelected(){ localStorage.setItem('bpp_selected_rolls', JSON.stringify([...selectedRolls])); }

function getSoldRollSet(){
  const s = new Set();
  state.sales.forEach(tx => tx.rollNos.forEach(rn => s.add(rn)));
  return s;
}
function getAvailableRolls(){
  const rollCol = findCol(state.prod.columns,'roll');
  if(!rollCol) return [];
  const sold = getSoldRollSet();
  return state.prod.rows.filter(r=> r[rollCol.key] && !sold.has(r[rollCol.key]));
}

function renderSalesTable(){
  const contentEl = document.getElementById('salesContent');
  contentEl.innerHTML = '';
  const rollCol = findCol(state.prod.columns,'roll');
  const prodProdCol = findCol(state.prod.columns,'product');
  const prodSizeCol = findCol(state.prod.columns,'size');
  const prodNetCol = findCol(state.prod.columns,'net');

  if(!rollCol){
    contentEl.innerHTML = '<div class="empty-msg">No columns configured.</div>';
    return;
  }

  const available = getAvailableRolls();
  const availableSet = new Set(available.map(r=>r[rollCol.key]));
  [...selectedRolls].forEach(rn=>{ if(!availableSet.has(rn)) selectedRolls.delete(rn); });

  const title = document.createElement('div');
  title.style.cssText='font-weight:700; margin-bottom:8px;';
  title.textContent='Available Rolls — tick to sell';
  contentEl.appendChild(title);

  const wrap = document.createElement('div'); wrap.className='tbl-wrap';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['','Roll No.','Product','Size','Net Wt'].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; trh.appendChild(th); });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');

  if(!available.length){
    const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=5;
    td.textContent='No available rolls.';
    td.style.cssText='text-align:center;color:var(--muted);padding:16px;';
    tr.appendChild(td); tbody.appendChild(tr);
  }

  available.forEach(r=>{
    const rn = r[rollCol.key];
    const tr = document.createElement('tr');
    const tickTd = document.createElement('td'); tickTd.style.textAlign='center';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = selectedRolls.has(rn);
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedRolls.add(rn); else selectedRolls.delete(rn);
      persistSelected(); updateSaleSummary();
    });
    tickTd.appendChild(cb); tr.appendChild(tickTd);

    [rn, prodProdCol?r[prodProdCol.key]:'', prodSizeCol?r[prodSizeCol.key]:'', prodNetCol?(r[prodNetCol.key]+' kg'):''].forEach(v=>{
      const td=document.createElement('td'); td.textContent=v||''; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  table.appendChild(tbody); wrap.appendChild(table); contentEl.appendChild(wrap);

  const summaryBox = document.createElement('div');
  summaryBox.id='saleSummaryBox';
  summaryBox.style.cssText='margin-top:12px; padding:10px 12px; background:#f2f4f7; border-radius:8px; font-size:0.9rem;';
  contentEl.appendChild(summaryBox);

  const form = document.createElement('div');
  form.style.cssText='margin-top:10px; display:flex; flex-direction:column; gap:8px;';
  const custInput = document.createElement('input'); custInput.type='text'; custInput.placeholder='Customer name'; custInput.id='saleCustomer';
  const dateInput = document.createElement('input'); dateInput.type='date'; dateInput.id='saleDate';
  const destInput = document.createElement('input'); destInput.type='text'; destInput.placeholder='Destination'; destInput.id='saleDestination';
  [custInput,dateInput,destInput].forEach(i=>{ i.style.cssText='padding:10px; border-radius:8px; border:1.5px solid var(--line); font-size:0.95rem;'; form.appendChild(i); });
  contentEl.appendChild(form);

  const sellBtn = document.createElement('button');
  sellBtn.textContent='Sell Selected Rolls';
  sellBtn.style.cssText='width:100%; margin-top:10px; padding:14px; font-weight:700; border:none; border-radius:10px; background:var(--ok); color:#fff; cursor:pointer;';
  sellBtn.addEventListener('click', onSell);
  contentEl.appendChild(sellBtn);

  updateSaleSummary();
  renderSalesHistory(contentEl);
}

function updateSaleSummary(){
  const box = document.getElementById('saleSummaryBox');
  if(!box) return;
  const rollCol = findCol(state.prod.columns,'roll');
  const prodNetCol = findCol(state.prod.columns,'net');
  const rows = state.prod.rows.filter(r=> rollCol && selectedRolls.has(r[rollCol.key]));
  const totalNet = rows.reduce((sum,r)=> sum + (parseFloat(prodNetCol? r[prodNetCol.key]:0)||0), 0);
  box.innerHTML = `<strong>${rows.length}</strong> roll(s) selected &middot; Total Net Wt: <strong>${totalNet.toFixed(2)} kg</strong>`;
}

function onSell(){
  const rollCol = findCol(state.prod.columns,'roll');
  const prodNetCol = findCol(state.prod.columns,'net');
  const customer = (document.getElementById('saleCustomer').value||'').trim();
  const dispatchDate = document.getElementById('saleDate').value||'';
  const destination = (document.getElementById('saleDestination').value||'').trim();

  if(!selectedRolls.size){ setStatus('Tick at least one roll first.', 'err'); return; }
  if(!customer){ setStatus('Enter Customer name.', 'err'); return; }

  const rollNos = [...selectedRolls];
  const rows = state.prod.rows.filter(r=> rollNos.includes(r[rollCol.key]));
  const totalNet = rows.reduce((sum,r)=> sum + (parseFloat(prodNetCol? r[prodNetCol.key]:0)||0), 0);

  state.sales.push({
    id: (business.deviceTag||'X')+'-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    customer, dispatchDate, destination,
    rollNos, totalNet: totalNet.toFixed(2),
    timestamp: formatTimestamp(),
    _synced: false
  });
  persist();
  selectedRolls = new Set(); persistSelected();
  setStatus('Sale recorded ✓', 'ok');
  renderAll();
  syncNow(true);
}

function renderSalesHistory(contentEl){
  if(!state.sales.length) return;
  const wrap = document.createElement('div');
  wrap.style.cssText='margin-top:22px;';
  const title=document.createElement('div'); title.style.cssText='font-weight:700; margin-bottom:8px;'; title.textContent='Sales History';

  const twrap = document.createElement('div'); twrap.className='tbl-wrap';

    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); twrap.appendChild(table); wrap.appendChild(twrap);
  contentEl.appendChild(wrap);
}

const GOOGLE_CLIENT_ID = '690314824350-r5bkhb9f3dkp09g6h4ealngq64nvvovp.apps.googleusercontent.com';
let syncInProgress = false;
let tokenClient = null;
let accessToken = null;
let authTokenExpiresAt = null;
let signedInEmail = null;

function persistAuthToken(){
  if(accessToken && authTokenExpiresAt){
    localStorage.setItem('bpp_authtoken_v1', JSON.stringify({ token:accessToken, expiresAt:authTokenExpiresAt, email:signedInEmail }));
  } else {
    localStorage.removeItem('bpp_authtoken_v1');
  }
}
function loadAuthToken(){
  try{
    const raw = localStorage.getItem('bpp_authtoken_v1');
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj && obj.token && obj.expiresAt && obj.expiresAt > Date.now()+60000){
      return obj;
    }
  }catch(e){}
  return null;
}

function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets email profile',
    callback: async (resp)=>{
      if(resp.error){ setStatus('Sign-in failed: '+resp.error, 'err'); return; }
      accessToken = resp.access_token;
      authTokenExpiresAt = Date.now() + (parseInt(resp.expires_in,10)||3600)*1000;
      await fetchUserInfo();
      persistAuthToken();
      updateAuthStatus();
      syncNow(true);
    }
  });
}

async function fetchUserInfo(){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${accessToken}` } });
    const info = await res.json();
    signedInEmail = info.email || null;
  }catch(e){ signedInEmail = null; }
  updateAuthStatus();
}

function updateAuthStatus(){
  const el = document.getElementById('authStatus');
  if(!el) return;
  el.textContent = signedInEmail ? ('Signed in as '+signedInEmail) : 'Not signed in';
}

async function sheetsGet(ssId, range){
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ssId}/values/${encodeURIComponent(range)}`, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  if(res.status===401){ accessToken=null; throw new Error('auth_expired'); }
  if(!res.ok){ throw new Error('sheets_error_'+res.status); }
  const data = await res.json();
  return data.values || [];
}

async function sheetsAppend(ssId, range, row){
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ssId}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED`, {
    method:'POST',
    headers: { Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ values:[row] })
  });
  if(res.status===401){ accessToken=null; throw new Error('auth_expired'); }
}

async function syncNow(quiet){
  const ssId = (business.spreadsheetId||'').trim();
  if(!ssId){ if(!quiet) setStatus('Add your Google Sheet ID in Business Details first.', 'err'); return; }
  if(!accessToken){
    if(!tokenClient){ if(!quiet) setStatus('Google sign-in still loading — try again in a moment.', 'err'); return; }
    tokenClient.requestAccessToken({ prompt: 'consent' });
    return;
  }
  if(syncInProgress) return;
  syncInProgress = true;
  if(!quiet) setStatus('Syncing…', '');

  try{
    const rollCol = findCol(state.prod.columns,'roll');
    const prodCol = findCol(state.prod.columns,'product'), sizeCol = findCol(state.prod.columns,'size'),
          grossCol = findCol(state.prod.columns,'gross'), coreCol = findCol(state.prod.columns,'core'),
          netCol = findCol(state.prod.columns,'net'), tsCol = findCol(state.prod.columns,'timestamp');

    let remoteProd = await sheetsGet(ssId, 'Production!A2:G');
    const knownRemoteRolls = new Set(remoteProd.map(r=>r[0]));
    const unsyncedRows = state.prod.rows.filter(r=>!r._synced);
    for(const r of unsyncedRows){
      const rn = rollCol ? r[rollCol.key] : '';
      if(rn && !knownRemoteRolls.has(rn)){
        await sheetsAppend(ssId, 'Production!A:G', [
          rn, prodCol?r[prodCol.key]:'', sizeCol?r[sizeCol.key]:'', grossCol?r[grossCol.key]:'',
          coreCol?r[coreCol.key]:'', netCol?r[netCol.key]:'', tsCol?r[tsCol.key]:''
        ]);
        knownRemoteRolls.add(rn);
      }
      r._synced = true;
    }

    let remoteSales = await sheetsGet(ssId, 'Sales!A2:G');
    const knownRemoteSaleIds = new Set(remoteSales.map(r=>r[0]));
    const unsyncedSales = state.sales.filter(s=>!s._synced);
    for(const s of unsyncedSales){
      if(!s.id) s.id = (business.deviceTag||'X')+'-'+Date.now()+'-'+Math.floor(Math.random()*1000);
      if(!knownRemoteSaleIds.has(s.id)){
        await sheetsAppend(ssId, 'Sales!A:G', [
          s.id, s.customer, s.dispatchDate, s.destination, (s.rollNos||[]).join(', '), s.totalNet, s.timestamp
        ]);
        knownRemoteSaleIds.add(s.id);
      }
      s._synced = true;
    }
    persist();

    const freshProd = await sheetsGet(ssId, 'Production!A2:G');
    const freshSales = await sheetsGet(ssId, 'Sales!A2:G');
    const freshOptions = await sheetsGet(ssId, 'Options!A2:B');

    let added = 0;
    if(rollCol){
      const known = new Set(state.prod.rows.map(r=>r[rollCol.key]));
      freshProd.forEach(r=>{
        const rn = r[0];
        if(rn && !known.has(rn)){
          const row = {}; state.prod.columns.forEach(c=>row[c.key]='');
          row[rollCol.key]=rn;
          if(prodCol) row[prodCol.key]=r[1]||'';
          if(sizeCol) row[sizeCol.key]=r[2]||'';
          if(grossCol) row[grossCol.key]=r[3]||'';
          if(coreCol) row[coreCol.key]=r[4]||'';
          if(netCol) row[netCol.key]=r[5]||'';
          if(tsCol) row[tsCol.key]=r[6]||'';
          row._synced=true;
          state.prod.rows.push(row); known.add(rn); added++;
        }
      });
    }
    const knownIds = new Set(state.sales.map(s=>s.id));
    freshSales.forEach(r=>{
      const id = r[0];
      if(id && !knownIds.has(id)){
        state.sales.push({
          id, customer:r[1]||'', dispatchDate:r[2]||'', destination:r[3]||'',
          rollNos:String(r[4]||'').split(',').map(s=>s.trim()).filter(Boolean),
          totalNet:r[5]||'', timestamp:r[6]||'', _synced:true
        });
        knownIds.add(id); added++;
      }
    });
    if(freshOptions.length){
      const optMap={};
      freshOptions.forEach(r=>{ if(r[0]) optMap[String(r[0]).trim()] = String(r[1]||'').split(',').map(s=>s.trim()).filter(Boolean); });
      state.prod.columns.forEach(c=>{ if(c.type==='select' && optMap[c.key]) c.options = optMap[c.key]; });
    }

    persist(); renderAll();
    if(!quiet) setStatus(`Synced ✓ (${added} new item${added===1?'':'s'})`, 'ok');
  }catch(err){
    if(err.message==='auth_expired'){
      authTokenExpiresAt = null;
      localStorage.removeItem('bpp_authtoken_v1');
      if(!quiet) setStatus('Session expired — tap Sync to sign in again.', 'err');
    } else if(!quiet){
      setStatus('Sync failed (offline or network error).', 'err');
    }
  }
  syncInProgress = false;
}

function renderAll(){
  renderOperatorForm();
  renderSalesTable();
  renderSettings();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');

    else if(btn.dataset.tab==='sales') renderSalesTable();

});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(selectedRolls.size > 0){
    setStatus('Finish or untick your pending roll selection in Sales before exporting.', 'err');
    return;
  }
  const rollCol = findCol(state.prod.columns,'roll');
  const prodProdCol = findCol(state.prod.columns,'product');
  const prodSizeCol = findCol(state.prod.columns,'size');
  const prodGrossCol = findCol(state.prod.columns,'gross');
  const prodCoreCol = findCol(state.prod.columns,'core');
  const prodNetCol = findCol(state.prod.columns,'net');
  const prodTsCol = findCol(state.prod.columns,'timestamp');

  function toDDMMYYYY(iso){
    if(!iso) return '';
    const parts = String(iso).split('-');
    if(parts.length!==3) return iso;
    const [y,m,d] = parts;
    return `${d}/${m}/${y}`;
  }

  const rows = state.prod.rows.map(r=>{
    const rollNo = rollCol ? r[rollCol.key] : '';
    const tx = state.sales.find(s=>s.rollNos.includes(rollNo));
    return {
      'Roll No.': rollNo,
      'Status': tx ? '🔴 Sold' : '🟢 Available',
      'Customer': tx ? tx.customer : '',
      'Net Wt': prodNetCol ? r[prodNetCol.key] : '',
      'Dispatch Date': tx ? toDDMMYYYY(tx.dispatchDate) : '',
      'Product': prodProdCol ? r[prodProdCol.key] : '',
      'Size': prodSizeCol ? r[prodSizeCol.key] : '',
      'Gross Wt': prodGrossCol ? r[prodGrossCol.key] : '',
      'Core Wt': prodCoreCol ? r[prodCoreCol.key] : '',
      'Timestamp': prodTsCol ? r[prodTsCol.key] : '',
      'Destination': tx ? tx.destination : ''
    };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Inventory');
  XLSX.writeFile(wb, 'BPP_Inventory_'+new Date().toISOString().slice(0,10)+'.xlsx');
  setStatus('Inventory exported ✓', 'ok');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all data on this phone?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  persistCounters({});
  opDraft = {}; saveDraft();
  selectedRolls = new Set(); persistSelected();
  persist(); renderAll();
  setStatus('Cleared.', 'ok');
});

function setStatus(msg, kind){
  const el=document.getElementById('status'); el.textContent=msg; el.className=kind||'';
  setTimeout(()=>{ el.textContent=''; }, 3000);
}

document.getElementById('syncBtn').addEventListener('click', ()=>syncNow(false));

renderAll();
renderSettings();

(function restoreAuthOnLoad(){
  const saved = loadAuthToken();
  if(saved){
    accessToken = saved.token;
    authTokenExpiresAt = saved.expiresAt;
    signedInEmail = saved.email || null;
    updateAuthStatus();
  }
})();

const _gsiWait = setInterval(()=>{
  if(typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    clearInterval(_gsiWait);
    initGoogleAuth();
    syncNow(true);
  }
}, 250);
setTimeout(()=>clearInterval(_gsiWait), 15000);
